name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tervian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tervian_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Banco efêmero do runner: cada execução começa vazia e roda as migrations.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tervian_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tervian_test
      # Credenciais de CI — nunca são usadas em produção.
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Checar formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (unit + integração, inclui isolamento multi-tenant)
        run: npm test

      - name: Build de produção
        run: npm run build
